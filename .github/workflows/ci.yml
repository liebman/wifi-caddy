name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check-lib:
    name: Check library crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The two manifests patch `esp-*` to the same esp-hal revision, and both
      # Cargo.lock files record it. They have to move together: if they drift, the
      # jobs build different esp-hal code and `--locked` fails with a lock error
      # that points at the wrong cause.
      - name: Check esp-hal patch revisions agree
        run: |
          set -euo pipefail
          rev_of() {
            sed -nE \
              's|^esp-hal = \{ git = "https://github\.com/esp-rs/esp-hal", rev = "([0-9a-f]+)" \}$|\1|p' \
              "$1" | head -n1
          }
          example=$(rev_of examples/wifi-example/Cargo.toml)
          lib=$(rev_of esp-wifi-caddy/Cargo.toml)
          echo "examples/wifi-example: ${example:-<none>}"
          echo "esp-wifi-caddy:        ${lib:-<none>}"
          if [ -z "$example" ] || [ -z "$lib" ]; then
            echo "::error::no esp-hal [patch] revision found in one of the manifests"
            exit 1
          fi
          if [ "$example" != "$lib" ]; then
            echo "::error::esp-hal revisions differ: example=$example esp-wifi-caddy=$lib"
            exit 1
          fi
          for lock in examples/wifi-example/Cargo.lock esp-wifi-caddy/Cargo.lock; do
            if ! grep -q "esp-hal?rev=${example}#" "$lock"; then
              echo "::error::$lock is not locked to esp-hal rev $example — regenerate it after bumping the patch"
              exit 1
            fi
          done

      - name: Install RISC-V toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          target: riscv32imc-unknown-none-elf,riscv32imac-unknown-none-elf,riscv32imafc-unknown-none-elf
          # Rust 1.97 matches the esp toolchain used for the Xtensa targets and
          # satisfies the crates' MSRV.
          toolchain: "1.97"
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ci-check-lib
          cache-all-crates: true

      - name: Check wifi-caddy
        run: cargo check --locked --target riscv32imac-unknown-none-elf
        working-directory: wifi-caddy

      - name: Test wifi-caddy
        run: cargo test --locked
        working-directory: wifi-caddy

      - name: Check wifi-caddy-proc
        run: cargo check --locked
        working-directory: wifi-caddy-proc

      - name: Test wifi-caddy-proc
        run: cargo test --locked
        working-directory: wifi-caddy-proc

      # Compile-only coverage for every Wi-Fi capable RISC-V chip. esp32c61 and
      # esp32s31 are kept here even though the example cannot link for them yet:
      # the crate itself compiles for both (build-example builds esp32, esp32s3
      # and the other RISC-V chips end to end; esp32s2 is skipped everywhere, see
      # the build-example matrix). This package build resolves the `esp-*` crates
      # through its own `[patch.crates-io]` (see the note in the workflow env), so
      # it needs GitHub access for the pinned esp-hal commit too.
      - name: Check esp-wifi-caddy (all RISC-V chips)
        working-directory: esp-wifi-caddy
        run: |
          set -e
          check() {
            echo "::group::esp-wifi-caddy --features $1 ($2)"
            cargo check --locked --target "$2" --features "$1"
            echo "::endgroup::"
          }
          check esp32c2  riscv32imc-unknown-none-elf
          check esp32c3  riscv32imc-unknown-none-elf
          check esp32c5  riscv32imac-unknown-none-elf
          check esp32c6  riscv32imac-unknown-none-elf
          check esp32c61 riscv32imac-unknown-none-elf
          check esp32s31 riscv32imafc-unknown-none-elf

  build-example:
    name: Build Example (${{ matrix.target }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    # When the commented-out esp32s2 / esp32c61 / esp32s31 entries in the matrix
    # are re-enabled they should carry `experimental: true`, together with:
    # continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        # Every Wi-Fi capable chip esp-wifi-caddy supports, except the three that
        # do not link yet (commented out below and in the include list):
        # esp32s2 (DRAM), esp32c61 and esp32s31 (upstream blobs/linker).
        target:
          [esp32, esp32s3, esp32c2, esp32c3, esp32c5, esp32c6]
        features: [log, defmt]
        include:
          # Xtensa chips: the esp toolchain supplies the target, build-std the
          # core/alloc crates.
          - target: esp32
            rust_target: xtensa-esp32-none-elf
            toolchain: +esp
            cargo_unstable: "-Zbuild-std=core,alloc"
            rustflags: "-D warnings -C link-arg=-nostartfiles -C link-arg=-Tlinkall.x"
          # - target: esp32s2
          #   rust_target: xtensa-esp32s2-none-elf
          #   toolchain: +esp
          #   cargo_unstable: "-Zbuild-std=core,alloc"
          #   rustflags: "-D warnings -C link-arg=-nostartfiles -C link-arg=-Tlinkall.x"
          #   # The demo's static buffers (WiFi blobs + heaps) exceed the ESP32-S2's
          #   # DRAM (~152 KB after caches), leaving less than the 8 KB main stack
          #   # esp-hal requires. Uncomment once the WiFi buffers are trimmed.
          - target: esp32s3
            rust_target: xtensa-esp32s3-none-elf
            toolchain: +esp
            cargo_unstable: "-Zbuild-std=core,alloc"
            rustflags: "-D warnings -C link-arg=-nostartfiles -C link-arg=-Tlinkall.x"
          # RISC-V chips: core/alloc come from the rustup target installed above.
          - target: esp32c2
            rust_target: riscv32imc-unknown-none-elf
            toolchain: ""
            cargo_unstable: ""
            rustflags: "-D warnings -C link-arg=-Tlinkall.x"
          - target: esp32c3
            rust_target: riscv32imc-unknown-none-elf
            toolchain: ""
            cargo_unstable: ""
            rustflags: "-D warnings -C link-arg=-Tlinkall.x"
          - target: esp32c5
            rust_target: riscv32imac-unknown-none-elf
            toolchain: ""
            cargo_unstable: ""
            rustflags: "-D warnings -C link-arg=-Tlinkall.x"
          - target: esp32c6
            rust_target: riscv32imac-unknown-none-elf
            toolchain: ""
            cargo_unstable: ""
            rustflags: "-D warnings -C link-arg=-Tlinkall.x"
          # - target: esp32c61
          #   rust_target: riscv32imac-unknown-none-elf
          #   toolchain: ""
          #   cargo_unstable: ""
          #   rustflags: "-D warnings -C link-arg=-Tlinkall.x"
          #   # esp-wifi-sys's C61/S31 blobs reference sections that rust-lld's
          #   # --gc-sections drops, and with GC disabled they need ROM symbols the
          #   # linker scripts do not provide. Uncomment when upstream links.
          # - target: esp32s31
          #   rust_target: riscv32imafc-unknown-none-elf
          #   toolchain: ""
          #   cargo_unstable: ""
          #   rustflags: "-D warnings -C link-arg=-Tlinkall.x"
    steps:
      - uses: actions/checkout@v4

      - name: Install Xtensa toolchain
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          version: 1.97.0.0

      - name: Install RISC-V toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          target: riscv32imc-unknown-none-elf,riscv32imac-unknown-none-elf,riscv32imafc-unknown-none-elf
          # Rust 1.97 matches the esp toolchain used for the Xtensa targets and
          # satisfies the crates' MSRV.
          toolchain: "1.97"
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "ci-${{ matrix.target }}"
          cache-all-crates: true

      # `--locked`: the committed Cargo.lock pins the esp-hal / esp-pacs /
      # esp-wifi-sys git revisions (see the workflow env note). Without it a
      # manifest revision bump would silently re-resolve and build a different
      # esp-hal than the one the lock records.
      - name: Build wifi-example
        working-directory: examples/wifi-example
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cargo ${{ matrix.toolchain }} build --locked --release --target ${{ matrix.rust_target }} --no-default-features --features "${{ matrix.target }},${{ matrix.features }}" ${{ matrix.cargo_unstable }}
