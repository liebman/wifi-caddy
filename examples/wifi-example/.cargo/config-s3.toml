# ESP32-S3 (xtensa). Used through the `clippy-s3` / `build-s3` / `run-s3` aliases:
#
#   cargo build-s3
#   (= cargo build --config .cargo/config-s3.toml --release --features esp32s3)

[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --chip esp32s3 --monitor"
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-C", "link-arg=-Tlinkall.x",
]
