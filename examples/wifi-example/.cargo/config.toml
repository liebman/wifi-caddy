# Aliases for every Wi-Fi capable chip esp-wifi-caddy supports. Each alias passes
# a chip-specific config file (`.cargo/config-<chip>.toml`), which sets
# `[build] target`, the espflash runner, the link flags and any chip-specific
# `[env]` values (e.g. the ESP32-S2 data cache):
#
#   cargo build-s3
#   => cargo build --config .cargo/config-s3.toml --release --features esp32s3
#
# Swap the `--features` value (e.g. `esp32c6,defmt`) to change the logging
# backend. The aliases for the chips whose blobs do not link with rust-lld yet
# (ESP32-C61, ESP32-S31) are commented out — see "Chip notes" in README.md.

[alias]
# ESP32 (xtensa)
clippy-32 = "clippy --config .cargo/config-32.toml --release --features esp32"
build-32  = "build  --config .cargo/config-32.toml --release --features esp32"
run-32    = "run    --config .cargo/config-32.toml --release --features esp32"

# ESP32-S2 (xtensa)
# Commented out: the demo's WiFi blobs plus heaps leave less than the 8 KB main
# stack esp-hal requires in the S2's DRAM. `.cargo/config-s2.toml` has the
# data-cache override that frees enough DRAM to link (verified locally) — enable
# both once that has been checked on hardware.
# clippy-s2 = "clippy --config .cargo/config-s2.toml --release --features esp32s2"
# build-s2  = "build  --config .cargo/config-s2.toml --release --features esp32s2"
# run-s2    = "run    --config .cargo/config-s2.toml --release --features esp32s2"

# ESP32-S3 (xtensa)
clippy-s3 = "clippy --config .cargo/config-s3.toml --release --features esp32s3"
build-s3  = "build  --config .cargo/config-s3.toml --release --features esp32s3"
run-s3    = "run    --config .cargo/config-s3.toml --release --features esp32s3"

# ESP32-C2 (riscv32imc)
clippy-c2 = "clippy --config .cargo/config-c2.toml --release --features esp32c2"
build-c2  = "build  --config .cargo/config-c2.toml --release --features esp32c2"
run-c2    = "run    --config .cargo/config-c2.toml --release --features esp32c2"

# ESP32-C3 (riscv32imc)
clippy-c3 = "clippy --config .cargo/config-c3.toml --release --features esp32c3"
build-c3  = "build  --config .cargo/config-c3.toml --release --features esp32c3"
run-c3    = "run    --config .cargo/config-c3.toml --release --features esp32c3"

# ESP32-C5 (riscv32imac)
clippy-c5 = "clippy --config .cargo/config-c5.toml --release --features esp32c5"
build-c5  = "build  --config .cargo/config-c5.toml --release --features esp32c5"
run-c5    = "run    --config .cargo/config-c5.toml --release --features esp32c5"

# ESP32-C6 (riscv32imac)
clippy-c6 = "clippy --config .cargo/config-c6.toml --release --features esp32c6"
build-c6  = "build  --config .cargo/config-c6.toml --release --features esp32c6"
run-c6    = "run    --config .cargo/config-c6.toml --release --features esp32c6"

# ESP32-C61 (riscv32imac)
# Commented out: esp-wifi-sys's C61 blobs do not link with rust-lld yet
# (--gc-sections drops sections they reference, and without GC they need ROM
# symbols the linker scripts do not provide).
# clippy-c61 = "clippy --config .cargo/config-c61.toml --release --features esp32c61"
# build-c61  = "build  --config .cargo/config-c61.toml --release --features esp32c61"
# run-c61    = "run    --config .cargo/config-c61.toml --release --features esp32c61"

# ESP32-S31 (riscv32imafc)
# Commented out: esp-wifi-sys's S31 blobs do not link with rust-lld yet, and the
# chip is still marked experimental by esp-hal.
# clippy-s31 = "clippy --config .cargo/config-s31.toml --release --features esp32s31"
# build-s31  = "build  --config .cargo/config-s31.toml --release --features esp32s31"
# run-s31    = "run    --config .cargo/config-s31.toml --release --features esp32s31"

# ---------------------------------------------------------------------------
# Shared configuration
# ---------------------------------------------------------------------------
# Target, runner and link flags live in the per-chip files
# (`.cargo/config-<chip>.toml`). Values here apply to every chip.

[unstable]
build-std = ["alloc", "core"]

[env]
ESP_LOG = "esp_wifi_caddy=debug,wifi_caddy::portal=debug,edge_captive=debug,info"
# ESP_LOG = "info"
DEFMT_LOG = "info"

# Memory profile for the HTTP config portal (read by wifi-caddy's build script,
# so it applies to the wifi-caddy build in this target directory). These are the
# wifi-caddy defaults; they are spelled out here so the example's footprint is
# explicit and does not drift if the defaults change.
#
# The portal serves requests with WIFI_CADDY_HANDLER_TASKS worker tasks, fed from a
# queue of accepted connections maintained by WIFI_CADDY_ACCEPTOR_TASKS acceptor
# tasks. A worker costs ~6,512 B (HTTP buffer + connection future), an acceptor only
# ~312 B — so acceptors buy connection *capacity* cheaply, while workers buy
# *parallelism* expensively. smoltcp has no listen backlog, which is why the
# capacity (Q) must exceed the worker count (P): a connection arriving while every
# worker is busy is accepted and queued instead of being reset (the iPhone bug).
#   2 + 4  -> 38,457 B portal RAM, capacity 4, queue depth 2   (default)
#   1 + 4  -> 31,945 B, capacity 4, queue depth 3              (smallest sensible)
#   2 + 6  -> 43,179 B, capacity 6, queue depth 4              (more margin)
#   4 + 4  -> 51,481 B, capacity 4, queue depth 0
# (all ESP32-C6, log, release; add DHCP 5,264 + DNS 2,408 + WiFi statics 7,916)
WIFI_CADDY_HANDLER_TASKS = "2"     # worker tasks (parallel requests)
WIFI_CADDY_ACCEPTOR_TASKS = "4"    # acceptor tasks (connection capacity), >= workers
WIFI_CADDY_HTTP_BUF_SIZE = "2048"  # per-connection request-head buffer (was 4096)
WIFI_CADDY_TCP_BUF_SIZE = "1024"   # per-connection TCP rx/tx buffer (was 2048)
WIFI_CADDY_HTTP_MAX_HEADERS = "32" # parsed request headers per connection (was 64)
WIFI_CADDY_IO_TIMEOUT_MS = "5000"  # idle IO timeout per connection (no timeout before)
# WIFI_CADDY_KEEPALIVE_TIMEOUT_MS = "3000"

# Socket counts per network stack. The AP stack has to cover the acceptor capacity
# (WIFI_CADDY_ACCEPTOR_TASKS) plus the DHCP and DNS servers plus headroom; every
# slot costs ~352 bytes.
ESP_WIFI_CADDY_AP_SOCKETS = "8"
ESP_WIFI_CADDY_STA_SOCKETS = "4"
