[package]
name = "esp-wifi-caddy"
version = "0.1.0"
edition = "2024"
authors = ["liebman <liebman@zod.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.97"
description = "WiFi STA+AP manager for Embassy (esp-radio, embassy-net)"
repository = "https://github.com/liebman/wifi-caddy"
keywords = ["esp32", "wifi", "embassy", "embedded", "captive-portal"]
categories = ["embedded", "no-std"]

[features]
default = ["captive"]
nightly = ["wifi-caddy/nightly"]
defmt = [
    "dep:defmt",
    "esp-radio/defmt",
    "embassy-time/defmt",
    "embassy-net/defmt",
    "wifi-caddy/defmt",
]
log = [
    "dep:log",
    "esp-radio/log-04",
    "wifi-caddy/log",
]
captive = ["wifi-caddy/captive"]
debug-server = ["wifi-caddy/debug-server"]

# this feature is required for the docs.rs build and release builds to work
esp-hal-unstable = ["esp-hal/unstable"]

# ---------------------------------------------------------------------------
# Chip selection
# ---------------------------------------------------------------------------
# Enable exactly one of the following features to select the target chip. Each
# one forwards the chip feature to `esp-radio` — so an application does not need
# an `esp-radio` dependency of its own to select a chip — and to the rest of the
# `esp-*` stack this crate builds on.
#
# Only Wi-Fi capable chips are listed. `esp-radio` also has `esp32h2` and
# `esp32p4` chip features, but those parts have no Wi-Fi driver and this crate
# always enables `esp-radio/wifi`.
esp32 = [
    "esp-hal/esp32",
    "esp-rtos/esp32",
    "esp-radio/esp32",
    "esp-storage/esp32",
    "esp-alloc/esp32",
    "esp-bootloader-esp-idf/esp32",
]
esp32c2 = [
    "esp-hal/esp32c2",
    "esp-rtos/esp32c2",
    "esp-radio/esp32c2",
    "esp-storage/esp32c2",
    "esp-alloc/esp32c2",
    "esp-bootloader-esp-idf/esp32c2",
]
esp32c3 = [
    "esp-hal/esp32c3",
    "esp-rtos/esp32c3",
    "esp-radio/esp32c3",
    "esp-storage/esp32c3",
    "esp-alloc/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
]
esp32c5 = [
    "esp-hal/esp32c5",
    "esp-rtos/esp32c5",
    "esp-radio/esp32c5",
    "esp-storage/esp32c5",
    "esp-alloc/esp32c5",
    "esp-bootloader-esp-idf/esp32c5",
]
esp32c6 = [
    "esp-hal/esp32c6",
    "esp-rtos/esp32c6",
    "esp-radio/esp32c6",
    "esp-storage/esp32c6",
    "esp-alloc/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
]
esp32c61 = [
    "esp-hal/esp32c61",
    "esp-rtos/esp32c61",
    "esp-radio/esp32c61",
    "esp-storage/esp32c61",
    "esp-alloc/esp32c61",
    "esp-bootloader-esp-idf/esp32c61",
]
esp32s2 = [
    "esp-hal/esp32s2",
    "esp-rtos/esp32s2",
    "esp-radio/esp32s2",
    "esp-storage/esp32s2",
    "esp-alloc/esp32s2",
    "esp-bootloader-esp-idf/esp32s2",
]
esp32s3 = [
    "esp-hal/esp32s3",
    "esp-rtos/esp32s3",
    "esp-radio/esp32s3",
    "esp-storage/esp32s3",
    "esp-alloc/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
]
# `esp-radio`'s Wi-Fi driver for the ESP32-S31 needs a recent
# `esp-metadata-generated` (>= 0.5.2) in the dependency graph.
esp32s31 = [
    "esp-hal/esp32s31",
    "esp-rtos/esp32s31",
    "esp-radio/esp32s31",
    "esp-storage/esp32s31",
    "esp-alloc/esp32s31",
    "esp-bootloader-esp-idf/esp32s31",
]

[package.metadata.docs.rs]
features = ["esp32c6", "esp-hal-unstable"]
targets = ["riscv32imac-unknown-none-elf"]
cargo-args = ["-Z", "build-std=alloc,core"]

[dependencies]
wifi-caddy = { version = "0.1.0", path = "../wifi-caddy" }

# The derive macro and the crates its generated code names are re-exported from
# this crate, so a config user only needs `esp-wifi-caddy` as a dependency.
wifi-caddy-proc = { version = "0.1.0", path = "../wifi-caddy-proc" }
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
serde-json-core = "0.6"

embassy-executor = { version = "0.10.0" }
embassy-time = { version = "0.5.0" }
embassy-sync = { version = "0.8" }
embassy-futures = { version = "0.1.2" }
embassy-net = { version = "0.9.0", features = [
    "dhcpv4",
    "medium-ethernet",
    "tcp",
    "udp",
    "dns",
] }

esp-hal = { version = "~1.2.2", features = ["unstable"] }
esp-alloc = "0.11.0"
esp-rtos = { version = "0.4.0", features = [
    "embassy",
    "esp-alloc",
    "esp-radio",
] }
# `esp-radio/unstable` exposes `WifiController::is_connected()` and
# `WifiController::subscribe()`, which the connection task uses to wait for a STA
# disconnect without busy-looping (see `wait_for_sta_disconnect` in src/lib.rs).
# `esp-hal/unstable` is enabled unconditionally for the same kind of need.
esp-radio = { version = "=1.0.0-beta.1", features = ["wifi", "unstable"] }

defmt = { version = "1.0.1", optional = true }
log = { version = "0.4", optional = true }

static_cell = { version = "2.1.1", default-features = false }
enumset = "1.1.10"
heapless = "0.9"

embedded-io-async = { version = "0.7" }
sequential-storage = { version = "7.0.1", features = ["alloc"] }
embassy-embedded-hal = { version = "0.6.0", features = ["time"] }
esp-storage = { version = "0.10.0", features = ["embedded-storage"] }

esp-bootloader-esp-idf = { version = "0.6.0", default-features = false }
